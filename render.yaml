services:
  - type: web
    name: bharatsetu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bharatsetu-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_DEMO_SEED
        value: "false"
      - key: VERIFICATION_MODE
        value: mock
      - key: LLM_PROVIDER
        value: mock
      - key: OCR_ENABLED
        value: "false"

databases:
  - name: bharatsetu-db
    databaseName: bharatsetu
    user: bharatsetu
