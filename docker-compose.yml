version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bharatsetu.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-only-change-this-secret}
      - ENABLE_DEMO_SEED=true
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - VERIFICATION_MODE=mock
      - OCR_ENABLED=true
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
